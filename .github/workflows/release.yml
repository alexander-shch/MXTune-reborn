name: Build and Release

# Triggers only on version tags (e.g. v1.2.29) or manual dispatch.
# Regular pushes to master (docs, CI tweaks, etc.) do NOT trigger a release.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.29). Defaults to VERSION file.'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Run unit tests
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -B build-tests tests/ -Wno-dev

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run tests
        run: cd build-tests && ctest --output-on-failure

  # ---------------------------------------------------------------------------
  # Resolve version: tag name → strip 'v', workflow_dispatch → input or VERSION
  # ---------------------------------------------------------------------------
  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Generate changelog
        run: python3 scripts/update_changelog.py
        env:
          PLUGIN_VERSION: ${{ steps.resolve.outputs.version }}

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: LATEST_RELEASE_NOTES.md

      - name: Commit updated CHANGELOG back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git pull origin master
          git add CHANGELOG.md
          git diff --staged --quiet && echo "No changelog changes to commit" && exit 0
          git commit -m "docs: update changelog for v${{ steps.resolve.outputs.version }} [skip ci]"
          git push origin master

  # ---------------------------------------------------------------------------
  # Build on all three platforms
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    env:
      PLUGIN_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            build-essential pkg-config ninja-build
            libfftw3-dev libsamplerate0-dev
            libaubio-dev libsoundtouch-dev librubberband-dev
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev
            libcurl4-openssl-dev libasound2-dev
            libglu1-mesa-dev mesa-common-dev
          version: 1.0

      - name: Cache Homebrew downloads
        if: matrix.name == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-fftw-aubio-soundtouch-rubberband
          restore-keys: brew-${{ runner.os }}-

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: brew install pkg-config ninja fftw aubio sound-touch rubberband

      - name: Cache vcpkg packages (Windows)
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed/x64-windows
          key: vcpkg-x64-windows-fftw3-aubio-soundtouch-rubberband-libsamplerate-v1

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        run: vcpkg install fftw3 aubio soundtouch rubberband libsamplerate --triplet x64-windows

      - name: Setup ccache (Linux/macOS)
        if: matrix.name != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-ccache-${{ matrix.name }}

      - name: Setup sccache (Windows)
        if: matrix.name == 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-sccache-windows
          variant: sccache

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: third_party/JUCE
          key: juce-8.0.12

      - name: Download JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name != 'windows'
        run: |
          mkdir -p third_party
          curl -fL "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" \
               -o third_party/juce-src.zip
          unzip -q third_party/juce-src.zip -d third_party/
          mv third_party/JUCE-8.0.12 third_party/JUCE
          rm third_party/juce-src.zip

      - name: Download JUCE (Windows)
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" `
                           -OutFile "third_party/juce-src.zip"
          Expand-Archive -Path "third_party/juce-src.zip" -DestinationPath "third_party/" -Force
          Rename-Item "third_party/JUCE-8.0.12" "JUCE"
          Remove-Item "third_party/juce-src.zip"

      - name: Setup MSVC environment (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (macOS)
        if: matrix.name == 'macos'
        run: |
          HOMEBREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -Wno-dev

      - name: Build
        run: cmake --build build --parallel

      # -----------------------------------------------------------------------
      # Package — JUCE native CMake produces proper VST3/AU bundles directly
      # -----------------------------------------------------------------------
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p package
          cp -r "build/MXTune_artefacts/Release/VST3/MXTune.vst3" package/
          cd package && zip -r "../MXTune-${PLUGIN_VERSION}-linux.zip" "MXTune.vst3"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p package
          cp -r "build/MXTune_artefacts/Release/VST3/MXTune.vst3" package/
          cp -r "build/MXTune_artefacts/Release/AU/MXTune.component" package/
          codesign --force --sign - "package/MXTune.vst3"
          codesign --force --sign - "package/MXTune.component"
          cd package && zip -r "../MXTune-${PLUGIN_VERSION}-macos.zip" "MXTune.vst3" "MXTune.component"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/MXTune_artefacts/VST3/MXTune.vst3" "package/"
          Compress-Archive -Path "package/MXTune.vst3" `
            -DestinationPath "MXTune-$env:PLUGIN_VERSION-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXTune-${{ matrix.name }}
          path: MXTune-${{ env.PLUGIN_VERSION }}-${{ matrix.name }}.zip

  # ---------------------------------------------------------------------------
  # Publish GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Prepare release body
        run: |
          cat artifacts/LATEST_RELEASE_NOTES.md > FULL_RELEASE_NOTES.md
          cat >> FULL_RELEASE_NOTES.md <<EOF

          ### Installation

          **macOS** — extract \`MXTune-*-macos.zip\`:
          - VST3: move \`MXTune.vst3\` to \`/Library/Audio/Plug-Ins/VST3/\`
          - AU: move \`MXTune.component\` to \`/Library/Audio/Plug-Ins/Components/\`

          Rescan plugins in your DAW.

          **Windows** — extract \`MXTune-*-windows.zip\`, move the \`MXTune.vst3\` folder to \`C:\Program Files\Common Files\VST3\\\`, rescan in your DAW.

          **Linux** — extract \`MXTune-*-linux.zip\`, move the \`MXTune.vst3\` folder to \`~/.vst3/\` or \`/usr/lib/vst3/\`, rescan in your DAW.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: MXTune v${{ needs.prepare.outputs.version }}
          body_path: FULL_RELEASE_NOTES.md
          files: |
            artifacts/MXTune-*-macos.zip
            artifacts/MXTune-*-windows.zip
            artifacts/MXTune-*-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
