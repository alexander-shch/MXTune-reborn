name: PR Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'

      - name: Configure tests
        run: cmake -B build-tests tests/ -Wno-dev

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run tests
        run: cd build-tests && ctest --output-on-failure

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            build-essential pkg-config ninja-build
            libfftw3-dev libsamplerate0-dev
            libaubio-dev libsoundtouch-dev librubberband-dev
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev
            libcurl4-openssl-dev libasound2-dev
            libglu1-mesa-dev mesa-common-dev
          version: 1.0

      - name: Cache Homebrew downloads
        if: matrix.name == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-fftw-aubio-soundtouch-rubberband

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: brew install pkg-config ninja fftw aubio sound-touch rubberband

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        run: vcpkg install fftw3 aubio soundtouch rubberband libsamplerate --triplet x64-windows

      - name: Setup ccache
        if: matrix.name != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.name }}

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: third_party/JUCE
          key: juce-8.0.12

      - name: Download JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name != 'windows'
        run: |
          mkdir -p third_party
          curl -fL "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" \
               -o third_party/juce-src.zip
          unzip -q third_party/juce-src.zip -d third_party/
          mv third_party/JUCE-8.0.12 third_party/JUCE
          rm third_party/juce-src.zip

      - name: Download JUCE (Windows)
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" `
                           -OutFile "third_party/juce-src.zip"
          Expand-Archive -Path "third_party/juce-src.zip" -DestinationPath "third_party/" -Force
          Rename-Item "third_party/JUCE-8.0.12" "JUCE"
          Remove-Item "third_party/juce-src.zip"

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (macOS)
        if: matrix.name == 'macos'
        run: |
          HOMEBREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -Wno-dev

      - name: Build
        if: matrix.name != 'windows'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: cmake --build build --parallel --config Release
