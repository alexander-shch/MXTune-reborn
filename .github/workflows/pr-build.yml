name: PR Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'

      - name: Configure tests
        run: cmake -B build-tests tests/ -Wno-dev

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run tests
        run: cd build-tests && ctest --output-on-failure

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.x'

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            build-essential pkg-config ninja-build
            libfftw3-dev libsamplerate0-dev
            libaubio-dev libsoundtouch-dev librubberband-dev
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxrender-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev
            libcurl4-openssl-dev libasound2-dev
            libglu1-mesa-dev mesa-common-dev
          version: 1.0

      - name: Cache Homebrew downloads
        if: matrix.name == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-fftw-aubio-soundtouch-rubberband

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos'
        run: brew install pkg-config ninja fftw aubio sound-touch rubberband

      - name: Export vcpkg root (Windows)
        if: matrix.name == 'windows'
        run: echo "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages (Windows)
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed/x64-windows
          key: vcpkg-x64-windows-fftw3-aubio-soundtouch-rubberband-libsamplerate-v1

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $portfile = "$env:VCPKG_INSTALLATION_ROOT\ports\soundtouch\portfile.cmake"
          (Get-Content $portfile -Raw) -replace 'SHA512 8bd199c6363104ba6c9af1abbd3c4da3567ccda5fe3a68298917817fc9312ecb0914609afba1abd864307b0a596becf450bc7073eeec17b1de5a7c5086fbc45e', 'SHA512 97e4afcce100f210d89c665dd83f4eaa7b0bec88ba35ba1cf29729e9260d143a5c0f89156646c4dddc83030c5f6b8493c6abc1a82bfba52ed6a87929c8e0fdea' | Set-Content $portfile
          vcpkg install fftw3 aubio soundtouch rubberband libsamplerate --triplet x64-windows

      - name: Setup ccache (Linux/macOS)
        if: matrix.name != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.name }}

      - name: Setup sccache (Windows)
        if: matrix.name == 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sccache-windows
          variant: sccache

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: third_party/JUCE
          key: juce-8.0.12

      - name: Download JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name != 'windows'
        run: |
          mkdir -p third_party
          curl -fL "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" \
               -o third_party/juce-src.zip
          unzip -q third_party/juce-src.zip -d third_party/
          mv third_party/JUCE-8.0.12 third_party/JUCE
          rm third_party/juce-src.zip

      - name: Download JUCE (Windows)
        if: steps.cache-juce.outputs.cache-hit != 'true' && matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          Invoke-WebRequest -Uri "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.12.zip" `
                           -OutFile "third_party/juce-src.zip"
          Expand-Archive -Path "third_party/juce-src.zip" -DestinationPath "third_party/" -Force
          Rename-Item "third_party/JUCE-8.0.12" "JUCE"
          Remove-Item "third_party/juce-src.zip"

      - name: Setup MSVC environment (Windows)
        if: matrix.name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (macOS)
        if: matrix.name == 'macos'
        run: |
          HOMEBREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOMEBREW_PREFIX" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -Wno-dev

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -Wno-dev

      - name: Build
        run: cmake --build build --parallel
